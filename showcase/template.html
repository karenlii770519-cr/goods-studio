<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
  :root { --ink: #1d2230; --muted: #6b7280; --accent: #5b6cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #f6f7fa 0%, #e6e9ef 60%, #d7dbe3 100%) fixed;
  }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
  header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; padding: 22px 24px 4px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border: 1px solid #cfd4de; background: rgba(255,255,255,.85); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 13px; transition: background .15s, border-color .15s; }
  button:hover { border-color: var(--accent); background: #fff; }
  #flipAll { background: var(--accent); border-color: var(--accent); color: #fff; }
  #cards { position: relative; z-index: 0; display: grid; align-content: center; min-height: calc(100vh - 90px); grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 1400px; margin: 0 auto; padding: 8px 24px 32px; }
  .card { margin: 0; display: flex; flex-direction: column; align-items: center; }
  .view { width: 100%; aspect-ratio: 63 / 88; max-height: 78vh; cursor: pointer; touch-action: pan-y; outline: none; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  .view:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  figcaption { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; margin-top: 2px; font-size: 14px; }
  figcaption span { font-weight: 500; }
  figcaption button { padding: 4px 12px; font-size: 12px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; z-index: 3; pointer-events: none; }
  body.ready #status { display: none; }
  @media (max-width: 820px) {
    #cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; padding: 6px 12px 24px; }
    header { padding: 16px 14px 2px; }
    .view { max-height: none; }
    #cards { min-height: 0; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header>
  <div>
    <h1>__TITLE__</h1>
    <p>__SUBTITLE__</p>
  </div>
  <button id="flipAll" type="button">全部翻面</button>
</header>
<main id="cards"></main>
<div id="status">載入中…</div>
<script>window.SHOWCASE = __DATA__;</script>
<script>__SCRIPT__</script>
</body>
</html>
